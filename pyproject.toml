[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stenographer"
version = "0.1.0"
description = "Transcribes audio/video recordings to text using mlx-whisper and KBLab models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.4.0; sys_platform == 'darwin'",
    "huggingface_hub>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
stenographer = "stenographer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stenographer"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Select a balanced, highly effective subset of rules
select = [
    "F",    # Pyflakes (catches fundamental runtime bugs/unused variables)
    "E",    # Pycodestyle errors (PEP 8 style violations)
    "W",    # Pycodestyle warnings (PEP 8 stylistic styling)
    "I",    # Isort (automates clean, sorted imports)
    "N",    # PEP8-naming (keeps naming conventions uniform across the team)
    "UP",   # Pyupgrade (suggests cleaner, modern Python syntax updates)
    "B",    # Flake8-bugbear (finds subtle logic design flaws and anti-patterns)
    "C4",   # Flake8-comprehensions (optimizes list/dict comprehension syntax)
    "SIM",  # Flake8-simplify (helps refactor over-engineered conditional logic)
    "PTH",  # Flake8-use-pathlib (encourages modern object-oriented path handling)
    "RUF",  # Ruff-specific rules (catches common AI/engine level pitfalls)
]

ignore = [
    # Rely on the automated ruff formatter to handle layout spacing and line splits.
    # Disabling these prevents linting conflicts with the formatter tool.
    "COM812", # Trailing comma missing
    "ISC001", # Implicit string concatenation
]

[tool.ruff.lint.per-file-ignores]
# Allow standard assert statements in test files without throwing a warning
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
