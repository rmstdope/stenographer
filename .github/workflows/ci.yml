name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt
        # Note: mlx-whisper has a sys_platform == "darwin" marker so it is
        # skipped on Linux. Tests use mocks and do not require the real library.

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
